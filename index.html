<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Propp Lozenge</title>
  <meta name="description" content="Puzzle de rombos que crea la ilusión de un cubo 3D." data-i18n-attr="content:meta.description">
  <script>
    // Aplica el tema guardado antes de pintar para evitar un destello.
    try {
      var savedTheme = localStorage.getItem('propp-theme');
      if (savedTheme === 'light' || savedTheme === 'dark') document.documentElement.dataset.theme = savedTheme;
    } catch (e) {}
  </script>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="layout">
    <section class="board-wrap">
      <svg id="board" role="img" aria-label="Tablero de rombos" data-i18n-attr="aria-label:board.label"></svg>
      <div id="win" class="win" hidden>
        <p class="win-title" data-i18n="win.title">¡Resuelto!</p>
        <p id="win-detail"></p>
        <button id="win-new" type="button" data-i18n="win.again">Jugar otra vez</button>
      </div>
      <p id="status" class="status" role="status" aria-live="polite"></p>
    </section>

    <div class="side">
      <aside class="panel">
        <div class="title-row">
          <h1>Propp Lozenge</h1>
          <div class="prefs">
            <div id="lang" class="lang-switch" role="group" aria-label="Idioma" data-i18n-attr="aria-label:lang.label">
              <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M3 12h18"/><path d="M12 3a14 14 0 0 1 0 18a14 14 0 0 1 0-18z"/></svg>
              <button type="button" data-lang="es" lang="es" title="Español">ES</button>
              <button type="button" data-lang="en" lang="en" title="English">EN</button>
            </div>
            <button id="theme" type="button" class="icon">
              <svg class="moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/></svg>
              <svg class="sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
            </button>
          </div>
        </div>
        <label><span data-i18n="size">Tamaño</span>
          <select id="size">
            <option value="2">2 × 2 × 2</option>
            <option value="3" selected>3 × 3 × 3</option>
            <option value="4">4 × 4 × 4</option>
            <option value="5">5 × 5 × 5</option>
          </select>
        </label>

        <hr class="sep">

        <div class="stats-row">
          <dl class="stats">
            <div><dt data-i18n="stats.moves">Movimientos</dt><dd id="moves">0</dd></div>
            <div><dt data-i18n="stats.time">Tiempo</dt><dd id="time">0:00</dd></div>
          </dl>
          <div class="history">
            <button id="undo" type="button" class="icon">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 14 4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 0 1 0 11H11"/></svg>
            </button>
            <button id="redo" type="button" class="icon">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m15 14 5-5-5-5"/><path d="M20 9H9.5a5.5 5.5 0 0 0 0 11H13"/></svg>
            </button>
          </div>
        </div>
        <div class="row2">
          <button id="spin" type="button" class="with-icon">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12a9 9 0 1 1-9-9c2.52 0 4.93 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/></svg>
            <span data-i18n="spin.label">Girar tablero</span>
          </button>
          <button id="solve-reset" type="button" class="with-icon">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M21 8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16Z"/><path d="m3.3 7 8.7 5 8.7-5"/><path d="M12 22V12"/></svg>
            <span data-i18n="reset">Restablecer</span>
          </button>
        </div>
        <button id="new" type="button" class="primary with-icon">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2 18h1.4c1.3 0 2.5-.6 3.3-1.7l6.1-8.6c.7-1.1 2-1.7 3.3-1.7H22"/><path d="m18 2 4 4-4 4"/><path d="M2 6h1.9c1.5 0 2.9.9 3.6 2.2"/><path d="M22 18h-5.9c-1.3 0-2.6-.7-3.3-1.8l-.5-.8"/><path d="m18 14 4 4-4 4"/></svg>
          <span data-i18n="new">Nuevo estado aleatorio</span>
        </button>

        <details class="help">
          <summary data-i18n="help.title">Cómo se juega</summary>
          <div class="help-body">
            <ul>
              <li data-i18n="help.goal"></li>
              <li data-i18n="help.select"></li>
              <li data-i18n="help.colors"></li>
              <li data-i18n="help.click"></li>
              <li data-i18n="help.shape"></li>
              <li data-i18n="help.board"></li>
              <li data-i18n="help.touch"></li>
              <li data-i18n="help.keys"></li>
            </ul>
          </div>
        </details>
      </aside>
      <small class="note" data-i18n="vibe"></small>
      <small class="note">
        <span data-i18n="credits">Puzzle inventado por James (Jim) Propp y diseñado por Oskar van Deventer.</span>
        <a href="https://www.etsy.com/listing/4565297719/pastilla-de-propp" target="_blank" rel="noopener" data-i18n="buy">Compra el puzzle físico</a>
      </small>
    </div>
  </main>

  <script src="src/i18n.js"></script>
  <script src="src/core.js"></script>
  <script src="src/presets.js"></script>
  <script src="src/renderer.js"></script>
  <script src="src/main.js"></script>
</body>
</html>
